PACKAGE_NAME="yoga-duet-ipu6-cameras"
PACKAGE_VERSION="0.2.0"

# PRE_BUILD reconstructs the four driver .c files from an upstream baseline
# (fetched by kernel version) + our custom patches.  See scripts/prepare.sh.
#
# NOTE: dkms requires the script to be invoked via a *relative path* that is
# executable from the build directory (it does `[[ -x $builddir/<first-token> ]]`).
# A leading "bash " would make it test `$builddir/bash` and silently skip the
# hook ("script is not executable"), leaving the sources ungenerated.  The
# script carries a shebang and resolves its own paths, so no interpreter prefix.
PRE_BUILD="scripts/prepare.sh"

BUILT_MODULE_NAME[0]="ov5678"
BUILT_MODULE_NAME[1]="gc5035"
BUILT_MODULE_NAME[2]="ipu-bridge"
BUILT_MODULE_NAME[3]="intel_skl_int3472_discrete"
BUILT_MODULE_NAME[4]="intel-ipu6-psys"

# The top-level Makefile compiles all five subdirs SERIALLY and copies each .ko
# into the build root, so DKMS finds every module at "." (build root).
BUILT_MODULE_LOCATION[0]="."
BUILT_MODULE_LOCATION[1]="."
BUILT_MODULE_LOCATION[2]="."
BUILT_MODULE_LOCATION[3]="."
BUILT_MODULE_LOCATION[4]="."

DEST_MODULE_LOCATION[0]="/updates/dkms"
DEST_MODULE_LOCATION[1]="/updates/dkms"
DEST_MODULE_LOCATION[2]="/updates/dkms"
DEST_MODULE_LOCATION[3]="/updates/dkms"
DEST_MODULE_LOCATION[4]="/updates/dkms"

# CachyOS kernels are built with clang (CONFIG_CC_IS_CLANG=y), so modules must
# be built with clang (LLVM=1), otherwise kernel build flags (e.g.
# -mllvm/-fexperimental-late-parse-attributes) are rejected by gcc.
#
# Single MAKE entry that builds the five subdirs serially. A single entry (as
# opposed to five parallel MAKE[] entries) avoids the race in the shared
# /lib/modules/.../build kernel tree that intermittently failed gc5035/ipu-bridge.
MAKE[0]="make LLVM=1 -C . KDIR=$kernel_source_dir"

AUTOINSTALL="yes"
